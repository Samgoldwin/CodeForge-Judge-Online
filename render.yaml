services:
  - type: web
    name: codetest
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JUDGE_CONCURRENCY
        value: "2"
    healthCheckPath: /health