services:
  - type: web
    name: codetest
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JUDGE_CONCURRENCY
        value: "2"
      - key: JUDGE_MODE
        value: judge0
      - key: KEEP_ALIVE_URL
        sync: false
      - key: UNOROUTER_API_KEY
        sync: false
      - key: UNOROUTER_BASE_URL
        value: https://api.unorouter.com/v1
      - key: UNOROUTER_MODEL
        value: claude-sonnet-5-5
    healthCheckPath: /health