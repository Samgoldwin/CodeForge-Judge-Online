name: Keep Render Awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.RENDER_HEALTH_URL || 'https://codeforge-judge-online-1.onrender.com' }}
        run: |
          url="${KEEP_ALIVE_URL%/}/health"
          echo "Pinging $url"
          curl -fsS --max-time 20 "$url" || true
